name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # windows-2025 has Visual Studio 2026; the generator is named so a missing one fails.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          lfs: false

      # The fonts are in Git LFS. Checkouts count against the LFS bandwidth quota,
      # so the objects are cached and pulled only when they change. Caches are
      # saved right after they're filled: actions/cache saves only at the end of
      # a successful job, so a later failure would throw them away.
      - name: List LFS objects
        run: git lfs ls-files --long | ForEach-Object { $_.Split(' ')[0] } | Sort-Object | Out-File -Encoding utf8 .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # The SDK has no loader (vulkan-1.dll) and the runner has no GPU driver to
      # install one; the executables import it, so test discovery needs it too.
      - name: Vulkan loader
        run: |
          curl -sSL -o vulkan-rt.zip https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanRT-1.4.309.0-Components.zip
          Expand-Archive vulkan-rt.zip -DestinationPath "${{ runner.temp }}/vulkan-rt"
          "${{ runner.temp }}\vulkan-rt\VulkanRT-1.4.309.0-Components\x64" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # The third-party libraries only change with the submodules or their build
      # files. Configure builds them (Debug and Release) when the cache misses.
      - name: Third-party cache key
        run: git submodule status | Out-File -Encoding utf8 .submodules-id
      - id: third-party-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/third_party/install
          key: third-party-vs2026-${{ hashFiles('.submodules-id', 'third_party/CMakeLists.txt', 'third_party/nanosvg/CMakeLists.txt', 'cmake/ThirdPartyCache.cmake') }}

      # Compiled shaders change only with the shaders and the SDK's compiler. The
      # checkout dates the sources now, so restored output is marked current; the
      # key guarantees it matches them. The build skips shaders that are current.
      - id: shader-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: workdirectory/shaders_compiled
          key: shaders-1.4.309.0-${{ hashFiles('workdirectory/shaders/**') }}
      - name: Mark restored shaders current
        if: steps.shader-cache.outputs.cache-hit == 'true'
        run: Get-ChildItem workdirectory/shaders_compiled | ForEach-Object { $_.LastWriteTime = Get-Date }

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
      - if: steps.third-party-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/third_party/install
          key: ${{ steps.third-party-cache.outputs.cache-primary-key }}

      - name: Build Debug
        run: cmake --build build --config Debug --parallel
      - if: steps.shader-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: workdirectory/shaders_compiled
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}
      - name: Build Release
        run: cmake --build build --config Release --parallel

      # GPU tests need a real device and stay manual.
      - name: Core tests (Debug)
        run: bin/Debug/gui_core_tests.exe
      - name: Core tests (Release)
        run: bin/Release/gui_core_tests.exe

      - name: Install the package
        run: |
          cmake --install build --config Debug   --prefix "${{ runner.temp }}/pkg"
          cmake --install build --config Release --prefix "${{ runner.temp }}/pkg"

      # A software Vulkan driver, so the consumer can render without a GPU.
      # 26.2.3 corrupts the heap in vkDestroyDescriptorPool; 26.2.4 is fine.
      # Jobs run elevated, and the loader ignores VK_DRIVER_FILES in elevated
      # processes, so the driver is registered like an installed one.
      - name: Software Vulkan driver (lavapipe)
        run: |
          curl -sSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          7z x -y mesa.7z x64/lvp_icd.x86_64.json x64/vulkan_lvp.dll "-o${{ runner.temp }}/mesa"
          $icd = "${{ runner.temp }}\mesa\x64\lvp_icd.x86_64.json"
          if (-not (Test-Path $icd)) { throw "lavapipe not extracted: $icd" }
          New-Item -Path HKLM:\SOFTWARE\Khronos\Vulkan\Drivers -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\Khronos\Vulkan\Drivers -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null

      - name: Package consumer renders a frame
        env:
          VK_LOADER_DEBUG: error,warn
        run: |
          cmake -S tests/package_consumer -B "${{ runner.temp }}/consumer" -G "Visual Studio 18 2026" -A x64 "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/pkg"
          cmake --build "${{ runner.temp }}/consumer" --config Release
          & "${{ runner.temp }}/consumer/Release/package_consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    # The pinned minimums (#59). GPU tests run on lavapipe; the build uses Ubuntu's
    # Vulkan headers and glslang, the tests the SDK's loader and layers, the same
    # version as Windows: Ubuntu's 1.3.275 synchronization validation reports
    # hazards that the frame's fence wait already covers.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc-13,   cxx: g++-13 }
          - { compiler: clang, cc: clang-17, cxx: clang++-17 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          lfs: false

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

      # SDL3 finds X11 and Wayland through their development packages. The downloaded
      # packages are cached: the runners' Ubuntu mirror is sometimes very slow (once
      # 37 MB in 21 minutes), and a hit leaves only what changed since to download.
      - id: apt-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-noble-${{ hashFiles('.github/linux-packages.txt') }}
      - name: Packages
        run: |
          mkdir -p "${{ runner.temp }}/apt-archives/partial"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="${{ runner.temp }}/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true $(cat .github/linux-packages.txt)
          sudo chmod -R a+rX "${{ runner.temp }}/apt-archives"
      - if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - id: sdk-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/vulkansdk
          key: vulkansdk-linux-1.4.309.0
      - name: Vulkan SDK (loader and layers for the GPU tests)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/vulkansdk"
          curl -sSL https://sdk.lunarg.com/sdk/download/1.4.309.0/linux/vulkansdk-linux-x86_64-1.4.309.0.tar.xz \
            | tar -xJ -C "${{ runner.temp }}/vulkansdk"

      - name: Third-party cache key
        run: git submodule status > .submodules-id
      - id: third-party-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/third_party/install
          key: third-party-linux-${{ matrix.compiler }}-${{ hashFiles('.submodules-id', 'third_party/CMakeLists.txt', 'third_party/nanosvg/CMakeLists.txt', 'cmake/ThirdPartyCache.cmake') }}

      - id: shader-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: workdirectory/shaders_compiled
          key: shaders-linux-${{ hashFiles('workdirectory/shaders/**') }}
      - name: Mark restored shaders current
        if: steps.shader-cache.outputs.cache-hit == 'true'
        run: find workdirectory/shaders_compiled -type f -exec touch {} +

      - name: Configure
        run: cmake -S . -B build -G "Ninja Multi-Config"
      - if: steps.third-party-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/third_party/install
          key: ${{ steps.third-party-cache.outputs.cache-primary-key }}

      - name: Build Debug
        run: cmake --build build --config Debug --parallel
      - if: steps.shader-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: workdirectory/shaders_compiled
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}
      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Core tests (Debug)
        run: xvfb-run -a bin/Debug/gui_core_tests
      - name: Core tests (Release)
        run: xvfb-run -a bin/Release/gui_core_tests

      - name: GPU tests (Debug, lavapipe)
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/vulkansdk/1.4.309.0/x86_64/lib
          VK_LAYER_PATH: ${{ runner.temp }}/vulkansdk/1.4.309.0/x86_64/share/vulkan/explicit_layer.d
        run: xvfb-run -a bin/Debug/gui_gpu_tests

      - name: Install the package
        run: |
          cmake --install build --config Debug   --prefix "${{ runner.temp }}/pkg"
          cmake --install build --config Release --prefix "${{ runner.temp }}/pkg"

      - name: Package consumer renders a frame
        run: |
          cmake -S tests/package_consumer -B "${{ runner.temp }}/consumer" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/pkg"
          cmake --build "${{ runner.temp }}/consumer"
          xvfb-run -a "${{ runner.temp }}/consumer/package_consumer"

  macos:
    # Untested on a Mac (#60): builds against MoltenVK and runs the headless tests.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          lfs: false

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

      - name: Packages
        run: brew install ninja vulkan-headers vulkan-loader molten-vk glslang

      - name: Third-party cache key
        run: git submodule status > .submodules-id
      - id: third-party-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/third_party/install
          key: third-party-macos-${{ hashFiles('.submodules-id', 'third_party/CMakeLists.txt', 'third_party/nanosvg/CMakeLists.txt', 'cmake/ThirdPartyCache.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G "Ninja Multi-Config" "-DCMAKE_PREFIX_PATH=$(brew --prefix)"
      - if: steps.third-party-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/third_party/install
          key: ${{ steps.third-party-cache.outputs.cache-primary-key }}

      - name: Build Debug
        run: cmake --build build --config Debug --parallel
      - name: Build Release
        run: cmake --build build --config Release --parallel

      # No GPU tests: the runner has no display, and the GUI is untested on a Mac.
      - name: Core tests (Debug)
        run: bin/Debug/gui_core_tests
      - name: Core tests (Release)
        run: bin/Release/gui_core_tests
