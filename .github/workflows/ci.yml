name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # windows-2025 has Visual Studio 2026; the generator is named so a missing one fails.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          lfs: false

      # The fonts are in Git LFS. Checkouts count against the LFS bandwidth quota,
      # so the objects are cached and pulled only when they change. Caches are
      # saved right after they're filled: actions/cache saves only at the end of
      # a successful job, so a later failure would throw them away.
      - name: List LFS objects
        run: git lfs ls-files --long | ForEach-Object { $_.Split(' ')[0] } | Sort-Object | Out-File -Encoding utf8 .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # The SDK has no loader (vulkan-1.dll) and the runner has no GPU driver to
      # install one; the executables import it, so test discovery needs it too.
      - name: Vulkan loader
        run: |
          curl -sSL -o vulkan-rt.zip https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanRT-1.4.309.0-Components.zip
          Expand-Archive vulkan-rt.zip -DestinationPath "${{ runner.temp }}/vulkan-rt"
          "${{ runner.temp }}\vulkan-rt\VulkanRT-1.4.309.0-Components\x64" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # The third-party libraries only change with the submodules or their build
      # files. Configure builds them (Debug and Release) when the cache misses.
      - name: Third-party cache key
        run: git submodule status | Out-File -Encoding utf8 .submodules-id
      - id: third-party-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/third_party/install
          key: third-party-vs2026-${{ hashFiles('.submodules-id', 'third_party/CMakeLists.txt', 'third_party/nanosvg/CMakeLists.txt', 'cmake/ThirdPartyCache.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
      - if: steps.third-party-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/third_party/install
          key: ${{ steps.third-party-cache.outputs.cache-primary-key }}

      - name: Build Debug
        run: cmake --build build --config Debug --parallel
      - name: Build Release
        run: cmake --build build --config Release --parallel

      # GPU tests need a real device and stay manual.
      - name: Core tests (Debug)
        run: bin/Debug/gui_core_tests.exe
      - name: Core tests (Release)
        run: bin/Release/gui_core_tests.exe

      - name: Install the package
        run: |
          cmake --install build --config Debug   --prefix "${{ runner.temp }}/pkg"
          cmake --install build --config Release --prefix "${{ runner.temp }}/pkg"

      # A software Vulkan driver, so the consumer can render without a GPU.
      # 26.2.3 corrupts the heap in vkDestroyDescriptorPool; 26.2.4 is fine.
      # Jobs run elevated, and the loader ignores VK_DRIVER_FILES in elevated
      # processes, so the driver is registered like an installed one.
      - name: Software Vulkan driver (lavapipe)
        run: |
          curl -sSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          7z x -y mesa.7z x64/lvp_icd.x86_64.json x64/vulkan_lvp.dll "-o${{ runner.temp }}/mesa"
          $icd = "${{ runner.temp }}\mesa\x64\lvp_icd.x86_64.json"
          if (-not (Test-Path $icd)) { throw "lavapipe not extracted: $icd" }
          New-Item -Path HKLM:\SOFTWARE\Khronos\Vulkan\Drivers -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\Khronos\Vulkan\Drivers -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null

      - name: Package consumer renders a frame
        env:
          VK_LOADER_DEBUG: error,warn
        run: |
          cmake -S tests/package_consumer -B "${{ runner.temp }}/consumer" -G "Visual Studio 18 2026" -A x64 "-DCMAKE_PREFIX_PATH=${{ runner.temp }}/pkg"
          cmake --build "${{ runner.temp }}/consumer" --config Release
          & "${{ runner.temp }}/consumer/Release/package_consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
