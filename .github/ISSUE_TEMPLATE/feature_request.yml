name: Feature request
description: Suggest something IntersticeUI should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: What are you trying to build, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: How you imagine the API or the control. Examples from other UI libraries are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: Any workaround you use today.
