<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inspector lists, dictionary and menus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 600px; height: 1040px; box-sizing: border-box; padding: 40px; background: {{t.app}}; color: {{t.t2}}; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; line-height: 16px">

<section aria-label="Inspector" style="width: 520px; display: flex; flex-direction: column; background: {{t.panel}}; border: 1px solid {{t.border}}; border-radius: 6px">
<div style="height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 4px 0 5px; background: {{t.header}}; border-bottom: 1px solid {{t.line}}; border-radius: 5px 5px 0 0">
<button style="height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 4px; background: {{t.active}}; color: {{t.t1}}; font: inherit; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.accent}}; stroke-width: 2; stroke-linecap: round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM12 16v-4M12 8h.01"></path></svg>Inspector</button>
</div>

<div style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; color: {{t.t1}}; font-weight: 600; font-size: 11.5px"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.t3}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m6 9 6 6 6-6"></path></svg>Lists</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 12px 12px">

<div style="display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 9px"><span>String list</span><span style="color: {{t.t3}}; font-size: 11px">3 items</span></div>
<div role="list" aria-label="String list" style="display: flex; flex-direction: column; gap: 2px; padding: 4px; border: 1px solid {{t.line}}; border-radius: 6px; background: {{t.listBg}}">
<sc-for list="{{strs}}" as="r" hint-placeholder-count="3">
<div role="listitem" style="height: 26px; display: grid; grid-template-columns: 14px 14px minmax(0, 1fr) 22px; align-items: center; gap: 6px; padding: 0 2px; border-radius: 4px; background: {{r.bg}}">
<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: {{t.t3}}"><circle cx="9" cy="6" r="1.5"></circle><circle cx="15" cy="6" r="1.5"></circle><circle cx="9" cy="12" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="9" cy="18" r="1.5"></circle><circle cx="15" cy="18" r="1.5"></circle></svg>
<span style="text-align: right; color: {{t.t3}}; font-family: 'JetBrains Mono', monospace; font-size: 10.5px">{{r.i}}</span>
<span style="height: 24px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border: 1px solid {{t.line2}}; border-radius: 4px; background: {{t.input}}; color: {{t.t1}}">{{r.v}}</span>
<button aria-label="Remove {{r.v}}" style="width: 22px; height: 22px; border: 0; border-radius: 4px; background: {{r.rmBg}}; color: {{r.rm}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
</sc-for>
<button style="height: 24px; margin: 2px 24px 0 42px; display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; border: 1px dashed {{t.ctlBorder}}; border-radius: 4px; background: transparent; color: {{t.t2}}; font: inherit; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M5 12h14M12 5v14"></path></svg>Add item</button>
</div>
</div>

<div style="display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 9px"><span>Float list</span><span style="color: {{t.t3}}; font-size: 11px">3 items · reordering</span></div>
<div role="list" aria-label="Float list" style="position: relative; display: flex; flex-direction: column; gap: 2px; padding: 4px; border: 1px solid {{t.line}}; border-radius: 6px; background: {{t.listBg}}">
<sc-for list="{{floats}}" as="r" hint-placeholder-count="3">
<sc-if value="{{r.insertBefore}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="height: 26px; box-sizing: border-box; margin: 0 24px 0 22px; border: 1px dashed {{t.accent}}; border-radius: 4px; background: {{t.soft}}"></div></sc-if>
<div role="listitem" style="height: 26px; display: grid; grid-template-columns: 14px 14px minmax(0, 1fr) 22px; align-items: center; gap: 6px; padding: 0 2px; border-radius: 4px; background: {{r.bg}}; box-shadow: {{r.shadow}}; transform: {{r.tf}}; opacity: {{r.op}}">
<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: {{r.grip}}"><circle cx="9" cy="6" r="1.5"></circle><circle cx="15" cy="6" r="1.5"></circle><circle cx="9" cy="12" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="9" cy="18" r="1.5"></circle><circle cx="15" cy="18" r="1.5"></circle></svg>
<span style="text-align: right; color: {{t.t3}}; font-family: 'JetBrains Mono', monospace; font-size: 10.5px">{{r.i}}</span>
<span style="height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid {{r.border}}; border-radius: 4px; background: {{t.input}}"><span style="flex: 1; color: {{t.t1}}; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">{{r.v}}</span><span style="color: {{t.t3}}; font-family: 'JetBrains Mono', monospace; font-size: 10px">f32</span></span>
<button aria-label="Remove {{r.v}}" style="width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: {{t.t3}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; left: 30px; right: 2px; top: 38px; height: 26px; display: grid; grid-template-columns: 14px 14px minmax(0, 1fr) 22px; align-items: center; gap: 6px; padding: 0 2px; border-radius: 4px; background: {{t.raised}}; box-shadow: {{t.dragShadow}}, 0 0 0 1px {{t.accent}}">
<svg width="14" height="14" viewBox="0 0 24 24" style="fill: {{t.accent}}"><circle cx="9" cy="6" r="1.5"></circle><circle cx="15" cy="6" r="1.5"></circle><circle cx="9" cy="12" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="9" cy="18" r="1.5"></circle><circle cx="15" cy="18" r="1.5"></circle></svg>
<span style="text-align: right; color: {{t.t3}}; font-family: 'JetBrains Mono', monospace; font-size: 10.5px">2</span>
<span style="height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid {{t.line2}}; border-radius: 4px; background: {{t.input}}"><span style="flex: 1; color: {{t.t1}}; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">3.1400001</span><span style="color: {{t.t3}}; font-family: 'JetBrains Mono', monospace; font-size: 10px">f32</span></span>
<span></span>
</div>
<button style="height: 24px; margin: 2px 24px 0 42px; display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; border: 1px dashed {{t.ctlBorder}}; border-radius: 4px; background: transparent; color: {{t.t2}}; font: inherit; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M5 12h14M12 5v14"></path></svg>Add item</button>
</div>
</div>

<div style="display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 31px"><span>Dictionary</span><span style="color: {{t.t3}}; font-size: 11px">3 entries</span></div>
<div role="table" aria-label="Dictionary" style="display: flex; flex-direction: column; gap: 2px; padding: 4px; border: 1px solid {{t.line}}; border-radius: 6px; background: {{t.listBg}}">
<div role="row" style="height: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 22px; align-items: center; gap: 6px; padding: 0 2px 0 4px; color: {{t.t3}}; font-size: 11px; font-weight: 500">
<span role="columnheader">Key <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 400">string</span></span><span role="columnheader">Value <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 400">i32</span></span><span></span>
</div>
<sc-for list="{{dict}}" as="r" hint-placeholder-count="3">
<div role="row" style="height: 26px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 22px; align-items: center; gap: 6px; padding: 0 2px; border-radius: 4px">
<span role="cell" style="height: 24px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border: 1px solid {{t.line2}}; border-radius: 4px; background: {{t.input}}; color: {{t.t1}}">{{r.k}}</span>
<span role="cell" style="height: 24px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border: 1px solid {{r.vBorder}}; box-shadow: {{r.vHalo}}; border-radius: 4px; background: {{t.input}}; color: {{t.t1}}; font-family: 'JetBrains Mono', monospace; font-size: 11.5px"><span style="background: {{r.selBg}}; border-radius: 2px">{{r.v}}</span></span>
<button aria-label="Remove {{r.k}}" style="width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: {{t.t3}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
</sc-for>
<button style="height: 24px; margin: 2px 24px 0 2px; display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; border: 1px dashed {{t.ctlBorder}}; border-radius: 4px; background: transparent; color: {{t.t2}}; font: inherit; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M5 12h14M12 5v14"></path></svg>Add entry</button>
</div>
</div>
</div>

<div style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-top: 1px solid {{t.divider}}; color: {{t.t1}}; font-weight: 600; font-size: 11.5px"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.t3}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m6 9 6 6 6-6"></path></svg>Menus</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 12px 14px">
<div style="min-height: 26px; display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: center; gap: 12px"><span>Small menu</span>
<button aria-haspopup="menu" aria-expanded="false" style="width: 160px; height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; border: 1px solid {{t.ctlBorder}}; border-radius: 4px; background: {{t.control}}; box-shadow: {{t.ctlShadow}}; color: {{t.t1}}; font: inherit; cursor: pointer">Open<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: auto; fill: none; stroke: {{t.t3}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="min-height: 26px; display: grid; grid-template-columns: 116px minmax(0, 1fr); align-items: center; gap: 12px"><span>Big menu</span>
<div style="position: relative">
<button aria-haspopup="menu" aria-expanded="true" style="width: 160px; height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; border: 1px solid {{t.accent}}; border-radius: 4px; background: {{t.control}}; box-shadow: 0 0 0 3px {{t.soft}}; color: {{t.t1}}; font: inherit; cursor: pointer">Open<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: auto; fill: none; stroke: {{t.t2}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m18 15-6-6-6 6"></path></svg></button>

<div role="menu" aria-label="Big menu" style="position: absolute; left: 0; top: 30px; width: 264px; z-index: 2; display: flex; flex-direction: column; padding: 4px; background: {{t.pop}}; border: 1px solid {{t.popBorder}}; border-radius: 8px; box-shadow: {{t.popShadow}}">
<div role="searchbox" aria-label="Filter commands" style="height: 26px; margin-bottom: 4px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid {{t.accent}}; box-shadow: 0 0 0 2px {{t.soft}}; border-radius: 4px; background: {{t.input}}; color: {{t.t3}}"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20 20l-3.5-3.5"></path></svg><span style="display: flex; align-items: center"><span aria-hidden="true" style="width: 2px; height: 14px; margin-right: 1px; border-radius: 1px; background: {{t.accent}}"></span>Filter commands</span><span style="margin-left: auto; padding: 0 5px; border-radius: 3px; background: {{t.hover}}; color: {{t.t3}}; font-family: 'JetBrains Mono', monospace; font-size: 10px">Esc</span></div>
<sc-for list="{{menu}}" as="m" hint-placeholder-count="14">
<sc-if value="{{m.isHeader}}" hint-placeholder-val="{{false}}"><div style="height: 22px; display: flex; align-items: flex-end; padding: 0 8px 3px 32px; color: {{t.t3}}; font-size: 11px; font-weight: 500">{{m.label}}</div></sc-if>
<sc-if value="{{m.isSep}}" hint-placeholder-val="{{false}}"><div role="separator" style="height: 1px; margin: 4px 0; background: {{t.line}}"></div></sc-if>
<sc-if value="{{m.isItem}}" hint-placeholder-val="{{true}}">
<div role="{{m.role}}" aria-checked="{{m.ariaChecked}}" aria-disabled="{{m.ariaDisabled}}" style="height: 26px; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 12px; align-items: center; gap: 8px; padding: 0 8px; border-radius: 4px; background: {{m.bg}}; color: {{m.fg}}; opacity: {{m.op}}">
<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{m.ic}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="{{m.d}}"></path></svg>
<span style="white-space: nowrap">{{m.label}}</span>
<span style="color: {{t.t3}}; font-family: 'JetBrains Mono', monospace; font-size: 10.5px">{{m.sc}}</span>
<sc-if value="{{m.sub}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.t3}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m9 18 6-6-6-6"></path></svg></sc-if>
</div>
</sc-if>
</sc-for>
</div>
</div>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":600,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const isLight = (this.props.theme ?? 'dark') === 'light';
    const t = isLight ? {
      app: '#E6E8EC', panel: '#FBFBFC', header: '#F3F4F6', active: '#E4E7EC', input: '#FFFFFF', control: '#FFFFFF',
      listBg: '#F6F7F9', hover: '#EAECF0', border: '#DADDE3', line: '#E3E6EB', line2: '#D5D9E0', ctlBorder: '#CDD2DA', divider: '#E9EBEF',
      t1: '#1A1D23', t2: '#464C57', t3: '#5F6673', accent: '#2F6FEB', soft: 'rgba(47,111,235,0.12)', error: '#D64545',
      ctlShadow: '0 1px 2px rgba(16,24,40,0.06)', raised: '#FFFFFF', dragShadow: '0 6px 16px rgba(16,24,40,0.16)',
      pop: '#FFFFFF', popBorder: '#D5D9E0', popShadow: '0 12px 32px rgba(16,24,40,0.16), 0 2px 6px rgba(16,24,40,0.08)'
    } : {
      app: '#0B0C0F', panel: '#121418', header: '#16191E', active: '#23272F', input: '#0D0F12', control: '#1E2128',
      listBg: '#101216', hover: '#1A1D23', border: '#1C1F25', line: '#23272F', line2: '#23272F', ctlBorder: '#2E333D', divider: '#1E2128',
      t1: '#E8EAEF', t2: '#AEB4C0', t3: '#8A92A2', accent: '#6B9BFF', soft: 'rgba(107,155,255,0.16)', error: '#EF6A6A',
      ctlShadow: 'none', raised: '#1E2128', dragShadow: '0 8px 20px rgba(0,0,0,0.5)',
      pop: '#1A1D23', popBorder: '#2E333D', popShadow: '0 16px 40px rgba(0,0,0,0.55)'
    };

    const strs = ['Apple', 'Banana', 'Cherry'].map(function (v, i) {
      const hover = i === 1;
      return { v: v, i: i, bg: hover ? t.hover : 'transparent', rm: hover ? t.error : t.t3, rmBg: hover ? (isLight ? 'rgba(214,69,69,0.10)' : 'rgba(239,106,106,0.12)') : 'transparent' };
    });

    const floats = [['1', 0], ['2.5', 1, true], ['3.1400001', 2, false, true]].map(function (f) {
      return {
        v: f[0], i: f[1], insertBefore: !!f[2],
        bg: 'transparent', shadow: 'none', tf: 'none', op: f[3] ? 0.35 : 1, grip: t.t3, border: t.line2
      };
    });

    const dict = [['speed', '1'], ['health', '100', true], ['damage', '25']].map(function (d) {
      return { k: d[0], v: d[1], vBorder: d[2] ? t.accent : t.line2, vHalo: d[2] ? '0 0 0 3px ' + t.soft : 'none', selBg: d[2] ? (isLight ? 'rgba(47,111,235,0.25)' : 'rgba(107,155,255,0.35)') : 'transparent' };
    });

    const P = {
      file: 'M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4M12 11v6M9 14h6',
      open: 'M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z',
      recent: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM12 7v5l3 2',
      check: 'M20 6 9 17l-5-5',
      dup: 'M8 8h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2ZM4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2',
      exp: 'M12 15V3M7 8l5-5 5 5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4',
      pub: 'M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13',
      del: 'M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'
    };
    const src = [
      ['h', 'File'],
      ['i', 'New', 'file', 'Ctrl N', { hover: true }],
      ['i', 'Open…', 'open', 'Ctrl O'],
      ['i', 'Open recent', 'recent', '', { sub: true }],
      ['s'],
      ['h', 'View'],
      ['i', 'Show grid', 'check', 'G', { check: true }],
      ['i', 'Show gizmos', 'check', '', { check: true }],
      ['i', 'Wireframe', '', 'Z', { check: false }],
      ['s'],
      ['i', 'Duplicate', 'dup', 'Ctrl D'],
      ['i', 'Export', 'exp', '', { sub: true }],
      ['i', 'Publish', 'pub', '', { disabled: true }],
      ['s'],
      ['i', 'Delete', 'del', 'Del', { danger: true }]
    ];
    const menu = src.map(function (m) {
      const o = m[4] || {};
      const isCheck = o.check !== undefined;
      return {
        isHeader: m[0] === 'h', isSep: m[0] === 's', isItem: m[0] === 'i',
        label: m[1] || '', d: m[2] ? P[m[2]] : '', sc: m[3] || '', sub: !!o.sub,
        role: isCheck ? 'menuitemcheckbox' : 'menuitem',
        ariaChecked: isCheck ? String(o.check) : undefined,
        ariaDisabled: o.disabled ? 'true' : undefined,
        bg: o.hover ? t.soft : 'transparent',
        fg: o.danger ? t.error : (o.hover ? t.t1 : t.t1),
        ic: o.danger ? t.error : (isCheck ? t.accent : t.t2),
        op: o.disabled ? 0.45 : 1
      };
    });

    return { t: t, strs: strs, floats: floats, dict: dict, menu: menu };
  }
}
</script>
</body>
</html>
