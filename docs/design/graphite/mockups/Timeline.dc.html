<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 480px; box-sizing: border-box; padding: 20px; background: {{t.app}}; color: {{t.t2}}; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; line-height: 16px">

<section aria-label="Timeline" style="width: 1240px; height: 440px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.panel}}; border: 1px solid {{t.border}}; border-radius: 6px; overflow: hidden">

<div style="height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 5px; background: {{t.header}}; border-bottom: 1px solid {{t.line}}">
<span style="height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 4px; background: {{t.active}}; color: {{t.t1}}; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.accent}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M3 6h18M3 12h18M3 18h18M8 3v6M15 9v6M11 15v6"></path></svg>Timeline</span>
<span style="height: 24px; display: flex; align-items: center; padding: 0 10px; color: {{t.t2}}">Curves</span>
<span style="height: 24px; display: flex; align-items: center; padding: 0 10px; color: {{t.t2}}">Audio mixer</span>
</div>

<div role="toolbar" aria-label="Transport" style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid {{t.line}}">
<div style="display: flex; gap: 2px">
<sc-for list="{{transport}}" as="b" hint-placeholder-count="6">
<button aria-label="{{b.label}}" aria-pressed="{{b.pressed}}" style="width: 26px; height: 26px; border: 0; border-radius: 4px; background: {{b.bg}}; color: {{b.fg}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: {{b.fill}}; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="{{b.d}}"></path></svg></button>
</sc-for>
</div>
<span style="width: 1px; height: 18px; background: {{t.line}}"></span>
<div style="height: 26px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid {{t.line}}; border-radius: 4px; background: {{t.input}}; font-family: 'JetBrains Mono', monospace">
<span style="color: {{t.t1}}; font-size: 13px; font-weight: 500">00:04.47</span><span style="color: {{t.t3}}">/ 00:08.00</span><span style="padding: 0 5px; border-radius: 3px; background: {{t.hover}}; color: {{t.t2}}; font-size: 11px">f 134</span>
</div>
<button style="height: 26px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; border: 1px solid {{t.ctlBorder}}; border-radius: 4px; background: {{t.control}}; color: {{t.t1}}; font: inherit">30 fps<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.t3}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m6 9 6 6 6-6"></path></svg></button>
<button aria-pressed="true" style="height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 4px; background: {{t.active}}; color: {{t.t1}}; font: inherit"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.accent}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15M5 8l4 4M12 15l4 4"></path></svg>Snap</button>
<div style="margin-left: auto; display: flex; align-items: center; gap: 8px; color: {{t.t3}}">
<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20 20l-3.5-3.5M8 11h6"></path></svg>
<span style="position: relative; width: 110px; height: 4px; border-radius: 2px; background: {{t.track}}"><span style="position: absolute; left: 0; top: 0; width: 40%; height: 4px; border-radius: 2px; background: {{t.accent}}"></span><span style="position: absolute; left: 40%; top: -5px; margin-left: -7px; width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: {{t.thumb}}; border: 3px solid {{t.accent}}"></span></span>
<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20 20l-3.5-3.5M8 11h6M11 8v6"></path></svg>
</div>
</div>

<div style="flex: 1; min-height: 0; display: flex">

<div style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid {{t.line}}">
<div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; padding: 0 6px 0 10px; border-bottom: 1px solid {{t.line}}; background: {{t.header}}">
<span style="color: {{t.t3}}; font-size: 11px; font-weight: 500">Tracks</span>
<label style="margin-left: auto; width: 120px; height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 6px; border: 1px solid {{t.line}}; border-radius: 4px; background: {{t.input}}; color: {{t.t3}}; font-size: 11px"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20 20l-3.5-3.5"></path></svg>Filter</label>
<button aria-label="Add track" style="width: 22px; height: 22px; margin-left: 2px; border: 0; border-radius: 4px; background: transparent; color: {{t.t2}}; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<div style="height: 28px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 {{r.pad}}px; border-bottom: 1px solid {{t.rowLine}}; background: {{r.bg}}; color: {{r.fg}}; font-weight: {{r.weight}}">
<sc-if value="{{r.open}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.t3}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m6 9 6 6 6-6"></path></svg></sc-if>
<sc-if value="{{r.closed}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.t3}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m9 18 6-6-6-6"></path></svg></sc-if>
<sc-if value="{{r.isGroup}}" hint-placeholder-val="{{false}}"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{r.chip}}"></span></sc-if>
<sc-if value="{{r.icon}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.t3}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="{{r.icon}}"></path></svg></sc-if>
<span style="white-space: nowrap">{{r.name}}</span>
<span style="margin-left: auto; display: flex; gap: 2px; color: {{t.t3}}">
<sc-if value="{{r.isGroup}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"></path></svg><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: 4px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 11h14v10H5ZM7 11V7a5 5 0 0 1 10 0v4"></path></svg></sc-if>
<sc-if value="{{r.isAudio}}" hint-placeholder-val="{{false}}"><span style="width: 18px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: {{t.hover}}; font-size: 10px; font-weight: 600">M</span><span style="width: 18px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: {{t.warnSoft}}; color: {{t.warnText}}; font-size: 10px; font-weight: 600">S</span></sc-if>
<sc-if value="{{r.isProp}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round"><path d="m12 4 8 8-8 8-8-8Z"></path></svg></sc-if>
</span>
</div>
</sc-for>
</div>

<div style="position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
<div aria-label="Ruler" style="position: relative; height: 28px; flex-shrink: 0; box-sizing: border-box; border-bottom: 1px solid {{t.line}}; background: {{t.header}}">
<div style="position: absolute; left: 12px; right: 12px; top: 0; bottom: 0">
<span style="position: absolute; left: 12.5%; width: 62.5%; top: 0; bottom: 0; background: {{t.soft}}; border-left: 2px solid {{t.accent}}; border-right: 2px solid {{t.accent}}; box-sizing: border-box"></span>
<sc-for list="{{ticks}}" as="k" hint-placeholder-count="33"><span style="position: absolute; left: {{k.x}}%; bottom: 0; width: 1px; height: {{k.h}}px; background: {{k.c}}"></span></sc-for>
<sc-for list="{{secs}}" as="s" hint-placeholder-count="8"><span style="position: absolute; left: {{s.x}}%; top: 4px; margin-left: 4px; color: {{t.t3}}; font-family: 'JetBrains Mono', monospace; font-size: 10.5px">{{s.l}}</span></sc-for>
</div>
</div>
<div style="position: relative; flex: 1">
<div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 0; bottom: 0">
<span style="position: absolute; left: -12px; width: calc(12.5% + 12px); top: 0; bottom: 0; background: {{t.outside}}"></span>
<span style="position: absolute; left: 75%; right: -12px; top: 0; bottom: 0; background: {{t.outside}}"></span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<div style="position: relative; height: 28px; box-sizing: border-box; border-bottom: 1px solid {{t.rowLine}}; background: {{r.laneBg}}">
<div style="position: absolute; left: 12px; right: 12px; top: 0; bottom: 0">
<sc-for list="{{r.keys}}" as="k" hint-placeholder-count="3"><span style="position: absolute; left: {{k.x}}%; top: 50%; width: {{k.s}}px; height: {{k.s}}px; margin: {{k.m}}; box-sizing: border-box; transform: rotate(45deg); border-radius: 2px; background: {{k.fill}}; border: 1px solid {{k.border}}"></span></sc-for>
<sc-if value="{{r.isAudio}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 5%; width: 87.5%; top: 3px; bottom: 3px; box-sizing: border-box; display: flex; align-items: center; gap: 1px; padding: 0 4px; border: 1px solid {{t.clipBorder}}; border-radius: 4px; background: {{t.clipBg}}; overflow: hidden">
<sc-for list="{{wave}}" as="w" hint-placeholder-count="160"><span style="flex: 1; height: {{w}}%; border-radius: 1px; background: {{t.wave}}"></span></sc-for>
</div>
</sc-if>
<sc-if value="{{r.isEvent}}" hint-placeholder-val="{{false}}">
<sc-for list="{{events}}" as="e" hint-placeholder-count="2"><span style="position: absolute; left: {{e.x}}%; top: 4px; bottom: 4px; display: flex; align-items: center; gap: 4px; padding-left: 4px; border-left: 2px solid {{t.event}}"><span style="padding: 0 5px; border-radius: 3px; background: {{t.eventSoft}}; color: {{t.t1}}; font-size: 11px">{{e.n}}</span></span></sc-for>
</sc-if>
<sc-if value="{{r.boxSel}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; left: 29.5%; width: 23.5%; top: 2px; bottom: 2px; box-sizing: border-box; border: 1px dashed {{t.accent}}; background: {{t.soft}}; border-radius: 2px"></span></sc-if>
</div>
</div>
</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 0; bottom: 0; pointer-events: none">
<div style="position: absolute; left: 55.875%; top: 0; bottom: 0; width: 0">
<span style="position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: {{t.accent}}"></span>
<span style="position: absolute; left: -22px; top: 4px; width: 44px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: {{t.accent}}; color: {{t.onAccent}}; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500">4.47</span>
</div>
</div>
</div>
</div>

<div style="height: 16px; flex-shrink: 0; display: flex; align-items: center; padding-left: 248px; padding-right: 8px; border-top: 1px solid {{t.line}}">
<span style="position: relative; flex: 1; height: 6px; border-radius: 3px; background: {{t.hover}}"><span style="position: absolute; left: 0; width: 100%; height: 6px; border-radius: 3px; background: {{t.scroll}}"></span></span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const isLight = (this.props.theme ?? 'dark') === 'light';
    const t = isLight ? {
      app: '#E6E8EC', panel: '#FBFBFC', header: '#F3F4F6', active: '#E4E7EC', hover: '#EAECF0', input: '#FFFFFF', control: '#FFFFFF',
      border: '#DADDE3', line: '#E3E6EB', rowLine: '#EEF0F3', ctlBorder: '#CDD2DA', track: '#D5D9E0', thumb: '#FFFFFF', scroll: '#C9CED6',
      t1: '#1A1D23', t2: '#464C57', t3: '#5F6673', accent: '#2F6FEB', onAccent: '#FFFFFF', soft: 'rgba(47,111,235,0.12)',
      outside: 'rgba(16,24,40,0.05)', key: '#5F6673', keyBorder: '#FFFFFF', summary: '#9AA1AD',
      warnSoft: 'rgba(217,154,43,0.18)', warnText: '#9A6512',
      clipBg: 'rgba(15,165,150,0.10)', clipBorder: 'rgba(15,165,150,0.55)', clipText: '#0B7A6F', wave: 'rgba(15,165,150,0.70)',
      event: '#D9771A', eventSoft: 'rgba(217,119,26,0.14)', chips: ['#2F6FEB', '#7C5CE0', '#D99A2B']
    } : {
      app: '#0B0C0F', panel: '#121418', header: '#16191E', active: '#23272F', hover: '#1A1D23', input: '#0D0F12', control: '#1E2128',
      border: '#1C1F25', line: '#23272F', rowLine: '#181B20', ctlBorder: '#2E333D', track: '#2A2F39', thumb: '#E8EAEF', scroll: '#2E333D',
      t1: '#E8EAEF', t2: '#AEB4C0', t3: '#8A92A2', accent: '#6B9BFF', onAccent: '#0B0C0F', soft: 'rgba(107,155,255,0.16)',
      outside: 'rgba(0,0,0,0.28)', key: '#C9CED8', keyBorder: '#121418', summary: '#6B7280',
      warnSoft: 'rgba(229,180,84,0.18)', warnText: '#E5B454',
      clipBg: 'rgba(52,209,191,0.10)', clipBorder: 'rgba(52,209,191,0.45)', clipText: '#5FE0D1', wave: 'rgba(52,209,191,0.65)',
      event: '#F59E4B', eventSoft: 'rgba(245,158,75,0.16)', chips: ['#6B9BFF', '#A98BFF', '#E5B454']
    };

    const P = {
      start: 'M19 20 9 12l10-8ZM5 19V5', prev: 'M11 17l-5-5 5-5M18 17l-5-5 5-5', play: 'M7 4v16l13-8Z',
      next: 'm13 17 5-5-5-5M6 17l5-5-5-5', end: 'M5 4l10 8-10 8ZM19 5v14',
      loop: 'm17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3'
    };
    const transport = [['Go to start', 'start'], ['Previous key', 'prev'], ['Play', 'play', 'play'], ['Next key', 'next'], ['Go to end', 'end'], ['Loop', 'loop', 'on']]
      .map(function (b) {
        const play = b[2] === 'play', on = b[2] === 'on';
        return {
          label: b[0], d: P[b[1]], pressed: on ? 'true' : undefined,
          bg: play ? t.accent : (on ? t.active : 'transparent'), fg: play ? t.onAccent : (on ? t.accent : t.t2),
          fill: play ? t.onAccent : 'none'
        };
      });

    const x = function (s) { return (s / 8 * 100).toFixed(3); };
    const key = function (s, sel) {
      return sel
        ? { x: x(s), s: 11, m: '-5.5px 0 0 -5.5px', fill: t.accent, border: isLight ? '#FFFFFF' : '#E8EAEF' }
        : { x: x(s), s: 10, m: '-5px 0 0 -5px', fill: t.key, border: t.keyBorder };
    };
    const summary = function (s) { return { x: x(s), s: 8, m: '-4px 0 0 -4px', fill: t.summary, border: t.keyBorder }; };

    const I = {
      cam: 'm16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 10.5M2 6h14v12H2Z',
      audio: 'M11 5 6 9H2v6h4l5 4ZM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14',
      flag: 'M4 22V4M4 4h12l-2 4 2 4H4'
    };
    const rows = [
      { name: 'Sphere', group: 0, open: true, keys: [0, 1, 2, 2.5, 3, 4, 5, 6].map(summary) },
      { name: 'Position', prop: true, sel: true, keys: [key(0), key(1), key(2.5, true), key(4, true), key(6)], boxSel: true },
      { name: 'Rotation', prop: true, keys: [key(0), key(3), key(6)] },
      { name: 'Scale', prop: true, keys: [key(2), key(5)] },
      { name: 'Camera', group: 1, open: true, keys: [1, 4.5].map(summary) },
      { name: 'Field of view', prop: true, keys: [key(1), key(4.5)] },
      { name: 'Light', group: 2, closed: true, keys: [0.5, 3.5, 7].map(summary) },
      { name: 'music.wav', audio: true, icon: I.audio, keys: [] },
      { name: 'Events', event: true, icon: I.flag, keys: [] }
    ].map(function (r) {
      const isGroup = r.group !== undefined;
      return {
        name: r.name, keys: r.keys, isGroup: isGroup, open: !!r.open, closed: !!r.closed, chip: isGroup ? t.chips[r.group] : '',
        isProp: !!r.prop, isAudio: !!r.audio, isEvent: !!r.event, icon: r.icon || '', boxSel: !!r.boxSel,
        pad: r.prop ? 34 : 10, weight: isGroup ? 600 : 400,
        bg: r.sel ? t.soft : 'transparent', laneBg: r.sel ? t.soft : 'transparent',
        fg: (isGroup || r.sel) ? t.t1 : t.t2
      };
    });

    const ticks = [];
    for (let i = 0; i <= 32; i++) {
      const major = i % 4 === 0;
      ticks.push({ x: (i / 32 * 100).toFixed(3), h: major ? 10 : 5, c: major ? t.t3 : (isLight ? '#C9CED6' : '#3A3F4A') });
    }
    const secs = [0, 1, 2, 3, 4, 5, 6, 7].map(function (s) { return { x: x(s), l: s + 's' }; });

    const wave = [];
    for (let i = 0; i < 160; i++) {
      const env = 0.35 + 0.65 * Math.abs(Math.sin(i * 0.045)) * (i % 40 < 3 ? 1.2 : 1);
      const n = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
      wave.push(Math.min(92, Math.round((0.25 + 0.75 * n) * env * 100)));
    }
    const events = [{ x: x(1.5), n: 'Spawn' }, { x: x(5.2), n: 'Explode' }];

    return { t: t, transport: transport, rows: rows, ticks: ticks, secs: secs, wave: wave, events: events };
  }
}
</script>
</body>
</html>
