<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color picker dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 640px; height: 600px; box-sizing: border-box; padding: 40px; display: flex; align-items: flex-start; justify-content: center; background: {{t.app}}; color: {{t.t2}}; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; line-height: 16px">

<div role="dialog" aria-label="Color" style="width: 560px; display: flex; flex-direction: column; background: {{t.panel}}; border: 1px solid {{t.border}}; border-radius: 8px; box-shadow: {{t.shadow}}; overflow: hidden">

<div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; background: {{t.header}}; border-bottom: 1px solid {{t.line}}">
<span style="color: {{t.t1}}; font-size: 13px; font-weight: 600">Color</span>
<span style="color: {{t.t3}}">Material / Tint</span>
<button aria-label="Close" style="margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: {{t.t2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>

<div style="display: flex; gap: 16px; padding: 16px">

<div style="display: flex; gap: 10px; flex-shrink: 0">
<div role="slider" aria-label="Saturation and value" aria-valuetext="Saturation 76%, value 96%" style="position: relative; width: 240px; height: 240px; border-radius: 6px; background: linear-gradient(to top, #000000, rgba(0,0,0,0)), linear-gradient(to right, #FFFFFF, hsl(217, 100%, 50%)); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25)">
<span style="position: absolute; left: 182px; top: 10px; width: 14px; height: 14px; margin: -7px 0 0 -7px; box-sizing: border-box; border-radius: 50%; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.4)"></span>
</div>
<div role="slider" aria-label="Hue" aria-valuenow="217" aria-valuemin="0" aria-valuemax="360" style="position: relative; width: 16px; height: 240px; border-radius: 4px; background: linear-gradient(to bottom, #FF0000 0%, #FFFF00 16.7%, #00FF00 33.3%, #00FFFF 50%, #0000FF 66.7%, #FF00FF 83.3%, #FF0000 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25)">
<span style="position: absolute; left: -3px; top: 145px; width: 22px; height: 6px; margin-top: -3px; box-sizing: border-box; border-radius: 3px; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.5)"></span>
</div>
<div role="slider" aria-label="Alpha" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="position: relative; width: 16px; height: 240px; border-radius: 4px; background: linear-gradient(to bottom, #3B82F6, rgba(59,130,246,0)), {{t.checker}}; box-shadow: inset 0 0 0 1px {{t.line2}}">
<span style="position: absolute; left: -3px; top: 3px; width: 22px; height: 6px; margin-top: -3px; box-sizing: border-box; border-radius: 3px; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.5)"></span>
</div>
</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; height: 40px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px {{t.line2}}; background: {{t.checker}}">
<span style="flex: 1; background: #3B82F6"></span>
<span style="flex: 1; background: #2E6FD8"></span>
</div>
<div style="display: flex; justify-content: space-between; color: {{t.t3}}; font-size: 11px"><span>New</span><span>Original</span></div>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<div role="group" aria-label="Color model" style="display: inline-flex; padding: 2px; gap: 2px; border-radius: 6px; background: {{t.well}}; border: 1px solid {{t.line}}">
<button aria-pressed="true" style="height: 22px; padding: 0 10px; border: 0; border-radius: 4px; background: {{t.segOn}}; box-shadow: {{t.segShadow}}; color: {{t.t1}}; font: inherit; cursor: pointer">RGB</button>
<button style="height: 22px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: {{t.t2}}; font: inherit; cursor: pointer">HSV</button>
<button style="height: 22px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: {{t.t2}}; font: inherit; cursor: pointer">HSL</button>
</div>
<button style="margin-left: auto; height: 26px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: {{t.t3}}; font: inherit; font-family: 'JetBrains Mono', monospace; font-size: 11px; cursor: pointer">0–255</button>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{channels}}" as="c" hint-placeholder-count="4">
<div style="height: 26px; display: grid; grid-template-columns: 14px minmax(0, 1fr) 52px; align-items: center; gap: 8px">
<span style="color: {{t.t2}}; font-weight: 500">{{c.l}}</span>
<span style="position: relative; height: 8px; border-radius: 4px; background: {{c.bg}}; box-shadow: inset 0 0 0 1px {{t.line2}}"><span style="position: absolute; left: {{c.p}}%; top: 4px; width: 12px; height: 12px; margin: -6px 0 0 -6px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3)"></span></span>
<span style="height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; border: 1px solid {{t.line2}}; border-radius: 4px; background: {{t.input}}; color: {{t.t1}}; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">{{c.v}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 6px">
<label for="hex" style="width: 30px; color: {{t.t2}}">Hex</label>
<input id="hex" type="text" value="#3B82F6" style="flex: 1; min-width: 0; height: 26px; box-sizing: border-box; padding: 0 8px; border: 1px solid {{t.accent}}; box-shadow: 0 0 0 3px {{t.soft}}; outline: none; border-radius: 4px; background: {{t.input}}; color: {{t.t1}}; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">
<button aria-label="Pick color from screen" style="width: 26px; height: 26px; box-sizing: border-box; border: 1px solid {{t.ctlBorder}}; border-radius: 4px; background: {{t.control}}; color: {{t.t1}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m2 22 1-1h3l9-9M3 21v-3l9-9M15 6l3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3Z"></path></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 6px">
<span style="width: 30px; color: {{t.t2}}">HDR</span>
<span style="flex: 1; height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid {{t.line2}}; border-radius: 4px; background: {{t.input}}"><span style="color: {{t.t3}}; font-size: 11px">Intensity</span><span style="margin-left: auto; color: {{t.t1}}; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">0.00</span></span>
<button aria-pressed="false" style="height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: {{t.t2}}; font: inherit; cursor: pointer"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 3px; border: 1px solid {{t.ctlBorder}}; background: {{t.input}}"></span>Linear</button>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid {{t.line}}">
<div style="display: flex; align-items: center; gap: 6px">
<span style="width: 64px; color: {{t.t3}}; font-size: 11px; font-weight: 500">Swatches</span>
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="12"><button aria-label="Swatch {{s.c}}, {{s.pct}} opacity" style="position: relative; width: 22px; height: 22px; box-sizing: border-box; padding: 0; border: 0; border-radius: 4px; overflow: hidden; display: flex; background: {{t.checker}}; box-shadow: {{s.ring}}; cursor: pointer"><span style="flex: 1; background: {{s.c}}"></span><span style="flex: 1; background: {{s.rgba}}"></span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: {{t.alphaTrack}}"><span style="display: block; width: {{s.pct}}; height: 2px; background: {{t.alphaFill}}"></span></span></button></sc-for>
<button aria-label="Add swatch" style="width: 22px; height: 22px; box-sizing: border-box; border: 1px dashed {{t.ctlBorder}}; border-radius: 4px; background: transparent; color: {{t.t2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<span style="width: 64px; color: {{t.t3}}; font-size: 11px; font-weight: 500">Recent</span>
<sc-for list="{{recent}}" as="s" hint-placeholder-count="6"><button aria-label="Recent {{s.c}}, {{s.pct}} opacity" style="width: 22px; height: 22px; box-sizing: border-box; padding: 0; border: 0; border-radius: 50%; overflow: hidden; display: flex; background: {{t.checker}}; box-shadow: 0 0 0 1px {{t.line2}}; cursor: pointer"><span style="flex: 1; background: {{s.c}}"></span><span style="flex: 1; background: {{s.rgba}}"></span></button></sc-for>
</div>
</div>

<div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: {{t.header}}; border-top: 1px solid {{t.line}}">
<span style="display: flex; align-items: center; gap: 6px; color: {{t.t3}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{t.ok}}"></span>sRGB · 8-bit</span>
<button style="margin-left: auto; height: 28px; padding: 0 14px; box-sizing: border-box; border: 1px solid {{t.ctlBorder}}; border-radius: 4px; background: {{t.control}}; color: {{t.t1}}; font: inherit; cursor: pointer">Cancel</button>
<button style="height: 28px; padding: 0 18px; border: 0; border-radius: 4px; background: {{t.accent}}; color: {{t.onAccent}}; font: inherit; font-weight: 600; cursor: pointer">OK</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":640,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = {
      app: '#0B0C0F', panel: '#121418', header: '#16191E', input: '#0D0F12', control: '#1E2128', well: '#0D0F12',
      segOn: '#2A2F39', segShadow: 'none', border: '#23272F', line: '#23272F', line2: '#2A2F39', ctlBorder: '#2E333D',
      t1: '#E8EAEF', t2: '#AEB4C0', t3: '#8A92A2', accent: '#6B9BFF', onAccent: '#0B0C0F', soft: 'rgba(107,155,255,0.16)',
      ok: '#4FC48A', checkA: '#2A2F39', checkB: '#1E2128',
      shadow: '0 24px 64px rgba(0,0,0,0.55)'
    };
    const light = {
      app: '#E6E8EC', panel: '#FBFBFC', header: '#F3F4F6', input: '#FFFFFF', control: '#FFFFFF', well: '#EEF0F3',
      segOn: '#FFFFFF', segShadow: '0 1px 2px rgba(16,24,40,0.12)', border: '#DADDE3', line: '#E3E6EB', line2: '#D5D9E0', ctlBorder: '#CDD2DA',
      t1: '#1A1D23', t2: '#464C57', t3: '#5F6673', accent: '#2F6FEB', onAccent: '#FFFFFF', soft: 'rgba(47,111,235,0.12)',
      ok: '#1E9E62', checkA: '#FFFFFF', checkB: '#E3E6EB',
      shadow: '0 24px 64px rgba(16,24,40,0.18)'
    };
    const t = (this.props.theme ?? 'dark') === 'light' ? light : dark;
    t.checker = 'repeating-conic-gradient(' + t.checkA + ' 0% 25%, ' + t.checkB + ' 0% 50%) 0 0 / 8px 8px';

    const channels = [
      { l: 'R', v: '59', p: 23.1, bg: 'linear-gradient(to right, rgb(0,130,246), rgb(255,130,246))' },
      { l: 'G', v: '130', p: 51.0, bg: 'linear-gradient(to right, rgb(59,0,246), rgb(59,255,246))' },
      { l: 'B', v: '246', p: 96.5, bg: 'linear-gradient(to right, rgb(59,130,0), rgb(59,130,255))' },
      { l: 'A', v: '255', p: 100, bg: 'linear-gradient(to right, rgba(59,130,246,0), rgb(59,130,246)), ' + t.checker }
    ];

    const ringSel = '0 0 0 2px ' + t.panel + ', 0 0 0 4px ' + t.accent;
    const ringOff = '0 0 0 1px ' + t.line2;
    const sw = function (hex, a) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return { c: hex, rgba: 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')', pct: Math.round(a * 100) + '%' };
    };
    const swatches = [
      ['#EF6A6A', 1], ['#F59E4B', 1], ['#E5B454', 1], ['#4FC48A', 1], ['#34D1BF', 0.5], ['#3B82F6', 1, true],
      ['#6B9BFF', 1], ['#A98BFF', 0.7], ['#F472B6', 1], ['#FFFFFF', 1], ['#000000', 0.5], ['#000000', 0]
    ].map(function (s) { const o = sw(s[0], s[1]); o.ring = s[2] ? ringSel : ringOff; return o; });
    const recent = [['#3B82F6', 0.6], ['#2E6FD8', 1], ['#FF2D2D', 1], ['#8B2DD6', 0.4], ['#2D3BFF', 1], ['#4FC48A', 1]]
      .map(function (s) { return sw(s[0], s[1]); });
    t.alphaTrack = (this.props.theme ?? 'dark') === 'light' ? '#464C57' : '#0B0C0F';
    t.alphaFill = (this.props.theme ?? 'dark') === 'light' ? '#FFFFFF' : '#E8EAEF';

    return { t: t, channels: channels, swatches: swatches, recent: recent };
  }
}
</script>
</body>
</html>
